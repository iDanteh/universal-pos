spring:
  application:
    name: pos-platform-backend

  datasource:
    url: ${POSPLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${POSPLATFORM_DB_USER:posplatform_app}
    password: ${POSPLATFORM_DB_PASSWORD:posplatform_app}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  # Flyway runs with a dedicated migration user (schema owner, DDL).
  # Runtime JPA uses the restricted application user (RLS subject).
  flyway:
    enabled: true
    url: ${POSPLATFORM_FLYWAY_URL:jdbc:postgresql://localhost:5432/platform}
    user: ${POSPLATFORM_FLYWAY_USER:posplatform_migrator}
    password: ${POSPLATFORM_FLYWAY_PASSWORD:posplatform_migrator}
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  health:
    probes:
      enabled: true

posplatform:
  version: 0.14.0
  cors:
    allowed-origins: ${POSPLATFORM_CORS_ORIGINS:http://localhost:5173}
  # Business time zone for report ranges (v0.13 · ADR-023): a sale at 23:59
  # local belongs to TODAY's corte, not to the UTC date.
  reports:
    time-zone: ${POSPLATFORM_REPORTS_TIME_ZONE:America/Mexico_City}
  fiscal:
    # PAC selection (ADR-016 + ADR-022): MOCK sandbox stamps validly-shaped
    # documents instantly; "http" seals with the CSD and calls a PAC gateway.
    provider: ${POSPLATFORM_FISCAL_PROVIDER:mock}
    # CFDI Fecha time zone (SAT expects local Mexico time, no offset).
    time-zone: ${POSPLATFORM_FISCAL_TIME_ZONE:America/Mexico_City}
    # CSD (Certificado de Sello Digital). Empty = Mock-only. NEVER commit
    # real .cer/.key files nor the password.
    csd:
      certificate: ${POSPLATFORM_FISCAL_CSD_CERTIFICATE:}
      private-key: ${POSPLATFORM_FISCAL_CSD_PRIVATE_KEY:}
      password: ${POSPLATFORM_FISCAL_CSD_PASSWORD:}
    # Vendor-neutral PAC gateway contract (v0.12 · ADR-022).
    pac:
      base-url: ${POSPLATFORM_FISCAL_PAC_BASE_URL:}
      token: ${POSPLATFORM_FISCAL_PAC_TOKEN:}
      stamp-path: ${POSPLATFORM_FISCAL_PAC_STAMP_PATH:/stamp}
      cancel-path: ${POSPLATFORM_FISCAL_PAC_CANCEL_PATH:/cancel}
      timeout-seconds: ${POSPLATFORM_FISCAL_PAC_TIMEOUT_SECONDS:20}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.posplatform: DEBUG
